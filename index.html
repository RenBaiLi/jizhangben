<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家庭记账本</title>
<meta name="theme-color" content="#2f9e44">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="记账本">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --green:#2f9e44; --green-d:#2b8a3e; --bg:#f2f2f7; --text:#1c1c1e;
  --sub:#8e8e93; --red:#ff3b30; --blue:#0a84ff; --pink:#ff5d8f;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--text);
}
button{font-family:inherit}

/* 顶栏 */
#topbar{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 8px 10px;
  background:rgba(255,255,255,.86);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-bottom:.5px solid #e3e3e8;
}
#topbar .t{font-size:18px;font-weight:600;flex:1;text-align:center}
#topbar .nav{
  border:none;background:none;font-size:26px;color:var(--green);
  width:44px;height:36px;line-height:1;cursor:pointer;
}

/* 内容 */
#view{max-width:560px;margin:0 auto;padding:14px 14px calc(110px + var(--safe-b))}
.card{
  background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;
  box-shadow:0 1px 3px rgba(0,0,0,.05);
}
.card-title{font-size:16px;font-weight:600;margin-bottom:10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.card-title small{font-weight:400;color:var(--sub);font-size:12px;margin-left:0}

/* 结余大卡 */
.hero{
  background:linear-gradient(135deg,#37b24d,var(--green-d));
  color:#fff;border-radius:20px;position:relative;overflow:hidden;
}
.hero::after{
  content:"";position:absolute;top:-40px;right:-30px;width:140px;height:140px;
  border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none;
}
.hero-label{font-size:13px;opacity:.92;position:relative}
.hero-bal{font-size:38px;font-weight:700;margin:8px 0 16px;font-variant-numeric:tabular-nums;letter-spacing:-.5px;position:relative}
.hero-bal.neg{color:#ffd6d6}
.hero-stats{display:flex;border-top:1px solid rgba(255,255,255,.22);padding-top:12px;position:relative}
.hero-stats>div{flex:1;text-align:center}
.hero-stats>div+div{border-left:1px solid rgba(255,255,255,.14)}
.hero-stats span{display:block;font-size:11px;opacity:.85}
.hero-stats b{display:block;font-size:14px;margin-top:3px;font-variant-numeric:tabular-nums;font-weight:600}

/* 列表行 */
.row{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 0;border-bottom:.5px solid #ececf0;font-size:15px;
}
.row:last-child{border-bottom:none}
.row.tap:active{background:#f6f6f8}
.row .val{color:var(--sub);font-variant-numeric:tabular-nums}
.row .val i{font-style:normal;color:#c7c7cc;margin-left:2px}
.row.total{font-weight:600}
.row.total .val{color:var(--text)}
.neg{color:var(--red)!important}

/* 明细行 */
.entry{display:grid;grid-template-columns:auto auto 1fr auto;gap:8px;justify-content:stretch}
.entry .d{color:var(--sub);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.entry .note{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.entry .amt{font-variant-numeric:tabular-nums;text-align:right}
.chip{
  font-size:11px;padding:2px 8px;border-radius:20px;white-space:nowrap;font-weight:500;
}
.chip.wife{background:#fff0f5;color:var(--pink)}
.chip.me{background:#e7f1ff;color:var(--blue)}
.chip.other{background:#f3f0ff;color:#845ef7}
.chip.inc{background:#e9f9ee;color:var(--green)}
.empty{color:var(--sub);font-size:13px;text-align:center;padding:14px 0}

/* 日历热力图 */
.cal{margin:8px 0 14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:10;background:#fff;padding:8px 4px 10px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.cal-w,.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-w span{font-size:11px;color:var(--sub);text-align:center;padding-bottom:3px}
.cal-g .cd{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  font-size:12px;color:var(--sub);border-radius:8px;background:#f6f6f8;
  transition:transform .12s;
}
.cal-g .cd.h1{background:#d3f9d8;color:#2b8a3e}
.cal-g .cd.h2{background:#fff3bf;color:#e67700}
.cal-g .cd.h3{background:#ffe3e3;color:#c92a2a;font-weight:600}
.cal-g .cd.tap:active{transform:scale(.92);opacity:.8}
.cal-g .cd.now{box-shadow:inset 0 0 0 2px var(--green)}
.cal-g .cd.now.h1,.cal-g .cd.now.h2,.cal-g .cd.now.h3{font-weight:700}
.cal-key{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--sub);margin-top:10px;justify-content:flex-end}
.cal-key i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-left:8px}
.cal-key i:first-child{margin-left:0}
.cal-key i.h1{background:#d3f9d8}
.cal-key i.h2{background:#fff3bf}
.cal-key i.h3{background:#ffe3e3}

/* 年度页柱状图 */
.ybars{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin:8px 0 4px}
.yb-col{display:flex;flex-direction:column;align-items:center;cursor:pointer}
.yb-col span{font-size:10px;color:var(--sub);margin-top:3px}
.yb-bars{
  height:110px;width:100%;display:flex;align-items:flex-end;justify-content:center;
  gap:2px;border-bottom:1px solid #ececf0;padding-bottom:1px;
}
.yb-bars i{display:block;width:8px;border-radius:3px 3px 0 0;min-height:1px}
.yb-bars i.in{background:#8ce99a}
.yb-bars i.out{background:#ffa8a8}
.yb-col:active .yb-bars i{opacity:.7}
.cal-key i.yb-k-in{background:#8ce99a}
.cal-key i.yb-k-out{background:#ffa8a8}

/* 累计结余走势图 */
.trend{display:block;width:100%;height:auto;margin-top:4px}
.trend text{user-select:none}

/* TOP10 排名徽标 */
.tentry{display:grid;grid-template-columns:24px auto auto 1fr auto;gap:8px;align-items:center;padding:9px 0;border-bottom:.5px solid #ececf0;font-size:14px}
.tentry:last-child{border-bottom:none}
.tentry .rank{font-size:13px;font-weight:700;color:var(--sub);text-align:center;font-variant-numeric:tabular-nums}
.tentry .rank.r1{color:#d4a017}
.tentry .rank.r2{color:#868e96}
.tentry .rank.r3{color:#a8590a}
.tentry .rank.medal{font-size:15px}
.tentry .d{color:var(--sub);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tentry .note{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.tentry .amt{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}

/* 购物小票样式: 当日详情 */
.receipt{
  background:#fffef7;max-width:330px;margin:0 auto 14px;
  padding:16px 14px 0;border-radius:3px;
  box-shadow:0 2px 12px rgba(0,0,0,.09);
  font-family:"Courier New",Consolas,Menlo,monospace;color:#1c1c1e;
}
.receipt *{font-family:inherit}
.rct-head{text-align:center;border-bottom:1px dashed #b8b8bd;padding-bottom:10px;margin-bottom:6px}
.rct-head .store{font-size:16px;font-weight:700;letter-spacing:2px}
.rct-head .date{font-size:11px;color:#6b6b70;margin-top:4px;letter-spacing:1px}
.rct-head .sub{font-size:10px;color:#8e8e93;margin-top:2px;letter-spacing:1px}
.rct-sec{font-size:10px;color:#6b6b70;text-align:center;letter-spacing:2px;margin:10px 0 4px}
.rct-line{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:13px;padding:4px 0}
.rct-line.tap:active{background:#fff7e6}
.rct-line .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rct-line .nm .tag{font-style:normal;font-size:9px;padding:1px 4px;border-radius:2px;margin-left:5px;letter-spacing:0;white-space:nowrap}
.rct-line .nm .tag.wife{background:#fff0f5;color:#ff5d8f}
.rct-line .nm .tag.me{background:#e7f1ff;color:#0a84ff}
.rct-line .nm .tag.other{background:#f3f0ff;color:#845ef7}
.rct-line .nm .tag.inc{background:#e9f9ee;color:#2f9e44}
.rct-line .am{font-variant-numeric:tabular-nums;white-space:nowrap}
.rct-dash{border-top:1px dashed #b8b8bd;height:0;margin:6px 0}
.rct-total{display:flex;justify-content:space-between;font-size:13px;font-weight:700;padding:3px 0}
.rct-net{display:flex;justify-content:space-between;font-size:14px;font-weight:700;padding:7px 0 0;border-top:2px solid #1c1c1e;margin-top:4px}
.rct-net.neg .am{color:#ff3b30}
.rct-foot{text-align:center;font-size:10px;color:#8e8e93;padding:8px 0 12px;line-height:1.7;letter-spacing:1px}
.receipt .empty{padding:10px 0;text-align:center}

/* 年度页 */
.yrow{display:grid;grid-template-columns:34px 1fr 1fr 1fr 1.15fr;gap:5px;justify-content:stretch;padding:9px 0;border-bottom:.5px solid #ececf0;font-size:14px}
.yrow .d{font-weight:600}
.yc{text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.yc i{font-style:normal;color:#c7c7cc;font-size:10px;margin-right:1px}
.yc.bal{font-weight:600}
.yc.cum{color:var(--sub);font-size:12px}
.yhead{font-size:11px;color:var(--sub);font-weight:500;letter-spacing:.5px}
.yrow.yhead{padding-bottom:6px;border-bottom:1px solid #ececf0}
.yrow.tap:active{background:#f6f6f8}
.yrow.yfoot{font-weight:600;border-top:1.5px solid #ececf0;border-bottom:none}
.yrow.yfoot .yc{font-size:13px}

/* 按钮 */
.btn{
  display:block;width:100%;border:none;border-radius:12px;
  padding:13px;font-size:16px;margin-top:10px;cursor:pointer;
}
.btn.primary{background:var(--green);color:#fff;font-weight:600}
.btn.primary:active{background:var(--green-d)}
.btn.ghost{background:#f2f2f7;color:var(--green);font-weight:500}
.btn.danger{background:#fff2f1;color:var(--red)}
.btn.big{font-size:17px;padding:15px}

/* 悬浮 ＋ */
#fab{
  position:fixed;right:20px;bottom:calc(74px + var(--safe-b));z-index:25;
  width:56px;height:56px;border-radius:50%;border:none;
  background:var(--green);color:#fff;font-size:30px;line-height:1;
  box-shadow:0 4px 14px rgba(47,158,68,.45);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
#fab:active{background:var(--green-d)}

/* 底部 Tab */
#tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  display:flex;background:rgba(255,255,255,.92);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:.5px solid #e3e3e8;
  padding-bottom:var(--safe-b);
}
#tabbar button{
  flex:1;border:none;background:none;padding:7px 0 5px;
  font-size:11px;color:var(--sub);cursor:pointer;
}
#tabbar button span{display:block;font-size:20px;margin-bottom:1px}
#tabbar button.on{color:var(--green)}

/* 弹层 */
#modalRoot .mask{
  position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.4);
  display:flex;align-items:flex-end;justify-content:center;
}
.sheet{
  background:#fff;width:100%;max-width:560px;
  border-radius:18px 18px 0 0;
  padding:20px 18px calc(18px + var(--safe-b));
  animation:up .22s ease-out;
}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.sheet-title{font-size:17px;font-weight:600;text-align:center;margin-bottom:14px}
.sheet input{
  width:100%;border:1px solid #ddd;border-radius:10px;
  padding:13px;font-size:16px;margin-bottom:10px;outline:none;
}
.sheet input:focus{border-color:var(--green)}
.sheet-btns{display:flex;gap:10px}
.sheet-btns .btn{flex:1;margin-top:4px}
.seg{display:flex;gap:8px;margin-bottom:10px}
.seg button{
  flex:1;border:1.5px solid #ddd;background:#fff;border-radius:10px;
  padding:11px;font-size:16px;color:var(--sub);cursor:pointer;
}
.seg button.on.wife{border-color:var(--pink);color:var(--pink);background:#fff0f5;font-weight:600}
.seg button.on.me{border-color:var(--blue);color:var(--blue);background:#e7f1ff;font-weight:600}
.seg button.on.other{border-color:#845ef7;color:#845ef7;background:#f3f0ff;font-weight:600}

/* 设置页 */
input.mini{
  border:1px solid #ddd;border-radius:8px;padding:7px 10px;
  font-size:15px;width:120px;text-align:right;outline:none;transition:border-color .15s;
}
input.mini:focus{border-color:var(--green)}
label.btn{text-align:center}
.about .card-title{margin-bottom:4px}
.about .preface{border-top:.5px solid #ececf0;margin-top:10px;padding-top:12px}
.about .preface p{font-size:13px;color:#6b6b70;line-height:1.8;margin:8px 0}
.about .preface p.ver{text-align:center;color:#c7c7cc;font-size:12px;margin-top:14px}
.hint{font-size:12px;color:var(--sub);margin:6px 2px 0;line-height:1.5}
</style>
</head>
<body>
<header id="topbar"></header>
<main id="view"></main>
<button id="fab" aria-label="记一笔">＋</button>
<nav id="tabbar">
  <button data-tab="month" class="on"><span>📒</span>本月</button>
  <button data-tab="year"><span>📊</span>年度</button>
  <button data-tab="me"><span>⚙️</span>我的</button>
</nav>
<div id="modalRoot"></div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
<script src="app.js"></script>
</body>
</html>
